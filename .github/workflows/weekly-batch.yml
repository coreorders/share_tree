name: Weekly Batch Data Collection

on:
  schedule:
    # Every Sunday at 14:27 UTC = 23:27 KST
    - cron: '27 14 * * 0'
  workflow_dispatch:

concurrency:
  group: sharegraph-data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly-collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pykrx pandas dart-fss python-dotenv

      - name: Test pipeline resilience
        run: python -m unittest discover -s tests -v

      - name: Initialize DB (if missing)
        run: python execution/init_db.py

      - name: Run Unified Weekly Data Collection
        run: python execution/fetch_weekly_all.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_BUSINESS_YEAR: ${{ vars.DART_BUSINESS_YEAR }}

      - name: Export JSON for Frontend
        run: python export_json.py
        env:
          NEXT_PUBLIC_GAS_URL: ${{ secrets.NEXT_PUBLIC_GAS_URL }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Preserve collected data for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-collected-data
          path: |
            web/stocks.db
            web/public/data.json
          retention-days: 14

      - name: Commit and Push DB and JSON changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/stocks.db web/public/data.json web/market-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Weekly batch data update [skip ci]"
          git pull --rebase origin main
          git push
