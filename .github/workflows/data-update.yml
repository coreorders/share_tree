name: Daily ShareGraph Data Update & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Run at 09:38 and 17:38 KST on weekdays (00:38 and 08:38 UTC)
    - cron: '38 0,8 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: [Weekly Batch Data Collection]
    types: [completed]
    branches: [main]

concurrency:
  group: sharegraph-data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      market-outcome: ${{ steps.market.outcome }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas dart-fss python-dotenv
          pip install git+https://github.com/sharebook-kr/pykrx.git

      - name: Test pipeline resilience
        run: python -m unittest discover -s tests -v

      - name: Initialize DB (if missing)
        run: python execution/init_db.py

      # A market outage must not block deployment of collected DART data.
      - name: Update Market Cap & Close Price (KOSPI & KOSDAQ)
        id: market
        continue-on-error: true
        run: python execution/update_market_cap.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Export JSON for Frontend
        run: python export_json.py
        env:
          NEXT_PUBLIC_GAS_URL: ${{ secrets.NEXT_PUBLIC_GAS_URL }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit and Push DB and json changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/stocks.db web/public/data.json web/market-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update stock data [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload exported JSON as artifact for next job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-json-data
          path: web/public/data.json
          retention-days: 1

  build-and-deploy:
    needs: update-data
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GAS_URL: ${{ secrets.NEXT_PUBLIC_GAS_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Download JSON Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-json-data
          path: web/public/

      - name: Install Node Dependencies
        working-directory: ./web
        run: npm ci

      - name: Create .env.local for Build
        working-directory: ./web
        run: |
          echo "NEXT_PUBLIC_GAS_URL=${{ secrets.NEXT_PUBLIC_GAS_URL }}" > .env.local

      - name: Build Next.js
        working-directory: ./web
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report stale market data after deployment
        if: needs.update-data.outputs.market-outcome == 'failure'
        run: |
          echo "::error::DART data deployed, but market prices remain stale. Check KRX password renewal and KRX_PW secret."
          exit 1
